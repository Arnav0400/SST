[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sst"
version = "0.1.0"
description = "Official implementation of SST for subspace-constrained language-model fine-tuning."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate==1.11.0",
  "datasets==4.3.0",
  "deepspeed==0.18.4",
  "flashinfer-python==0.5.3",
  "PyYAML>=6.0",
  "safetensors>=0.4.5",
  "torch==2.9.0",
  "transformers==4.57.1",
  "trl==0.24.0",
  "vllm==0.12.0",
]

[project.scripts]
sst-train = "sst.cli:main"

[tool.setuptools.packages.find]
include = ["sst*"]
